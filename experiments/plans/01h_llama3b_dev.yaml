plan_id: tax_zeroshot_llama_dev
description: >
  Llama 3.2 3B, prompt-JSON then Outlines, on the 50 Domain-A dev papers.
  This process loads only the 3B model. HF_TOKEN is required.
jobs:
  - cell: A
    decode_arm: prompt_json
    model_id: meta-llama/Llama-3.2-3B-Instruct
    split: dev
    domain: A
    data_rev: v0
    max_docs: 150
  - cell: B
    decode_arm: constrained
    model_id: meta-llama/Llama-3.2-3B-Instruct
    split: dev
    domain: A
    data_rev: v0
    max_docs: 150
